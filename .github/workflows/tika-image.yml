# Build-only image workflow for this fork.
#
# Upstream's mcp-release.yml also cuts GitHub releases and publishes to the MCP
# registry, which a fork must not do, so this builds and pushes the container
# and nothing else. Triggered on the patch branch, never on main.
name: Fork MCP image

on:
  push:
    branches:
      - tika-extract
    paths:
      - 'mcp-server/**'
      - 'docker/mcp-server/**'
      - '.github/workflows/tika-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./mcp-server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./docker/mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiquila-mcp:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/aiquila-mcp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
